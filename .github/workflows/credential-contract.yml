name: Credential Contract Verification

# 凭证契约校验 CI 集成（原 scripts/verify-credential-contract.sh 仅为手动运行）。
# 约束链：.env.dev 的 SPRING_DATASOURCE_PASSWORD 必须 == .env.prod.backend 的同名变量
#         （prod-mysql 的 prj_user 由 base mysql 用 .env.dev 口令初始化，prod 后端据此连接）。
on:
  workflow_dispatch:
  push:
    paths:
      - '.env.dev'
      - '.env.prod'
      - '.env.prod.backend'
      - 'scripts/verify-credential-contract.sh'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify credential contract (if env files present)
        run: |
          if [ -f .env.dev ] && [ -f .env.prod.backend ]; then
            bash scripts/verify-credential-contract.sh
          else
            echo "⚠️ .env.dev / .env.prod.backend 不存在（CI 中通常由 Secret 注入），跳过凭证契约校验。"
            echo "   本地部署前请手动运行: bash scripts/verify-credential-contract.sh"
          fi
